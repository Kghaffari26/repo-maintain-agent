# SPEC_REPO_MAINT.md §8.6, §10: two least-privilege jobs, one per mode, both
# delegating the run itself to the agents-core reusable workflow. run-agent.yml
# (>= v0.2.0) declares no permissions of its own, so each job below grants exactly
# what its run may use: `contents: write` always (it commits data/ back and
# force-pushes public-data/ to the `data` branch), `issues: write` only in apply
# mode (labels + one triage comment), read-only everything else. It restores the
# `data` branch into public-data/ before the run, passes GITHUB_TOKEN,
# REPO_MAINT_TOKEN and APPLY_CHANGES to the agent, and publishes trace.json.
#
# The sandbox's fix proposals (draft PRs, §6.1) are written with REPO_MAINT_TOKEN, a
# fine-grained PAT scoped to the sandbox repo only, never with this run's token, so
# neither job grants pull-requests: write.
name: Repo maintenance agent

on:
  schedule:
    - cron: "0 14 * * *" # 07:00 PT
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated owner/name list to run against (optional; default: every repo in config/repos.toml)"
        required: false
        type: string
      approve_fix:
        description: "Fix proposal id(s) to open as DRAFT PRs, comma-separated (apply mode only; spec §6.1)"
        required: false
        type: string

concurrency:
  group: repo-maint-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  report:
    name: Report (read-only)
    if: vars.APPLY_CHANGES != 'true'
    permissions:
      contents: write
      issues: read
      pull-requests: read
      checks: read
    uses: Kghaffari26/agents-core/.github/workflows/run-agent.yml@v0.3.0
    with:
      agent: repo_maint
      max_run_usd: "0.40"
      site_repo: Kghaffari26/agents-hub
      # Split on whitespace and passed as arguments, never shell-evaluated
      # (run-agent.yml >= v0.2.0); the agent rejects repos not in its config.
      extra_args: ${{ inputs.repos && format('--repos {0}', inputs.repos) || '' }}
    secrets: inherit

  apply:
    name: Apply (labels + one triage comment per eligible issue)
    if: vars.APPLY_CHANGES == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: read
      checks: read
    uses: Kghaffari26/agents-core/.github/workflows/run-agent.yml@v0.3.0
    with:
      agent: repo_maint
      max_run_usd: "0.40"
      site_repo: Kghaffari26/agents-hub
      # --apply is gate 1 and APPLY_CHANGES=true gate 2 of 5 (§8.1). Gates 3-5
      # (allow_apply, role own/sandbox, a write token) are checked per repo in code;
      # fix-proposal PRs additionally need allow_fix_prs = true (§6.1).
      apply_changes: true
      # A human approving fix proposals by id (--approve-fix) is what lets a draft PR
      # be opened; the agent rejects anything that isn't a 12-hex-digit id.
      extra_args: >-
        --apply
        ${{ inputs.repos && format('--repos {0}', inputs.repos) || '' }}
        ${{ inputs.approve_fix && format('--approve-fix {0}', inputs.approve_fix) || '' }}
    secrets: inherit
