[project]
name = "repo-maint-agent"
version = "0.1.0"
description = "Daily GitHub repo maintenance agent: issue triage, stale-PR nudges, changelog drafts and health scoring."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8",
    "scikit-learn>=1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
