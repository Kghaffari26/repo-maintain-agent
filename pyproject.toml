[project]
name = "repo-maintain-agent"
version = "0.1.0"
description = "Daily GitHub repo maintenance agent: issue triage, stale-PR nudges, changelog drafts and health scoring."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "core"]
