[project]
name = "repo-maint-agent"
version = "0.1.0"
description = "Daily GitHub repo maintenance agent: issue triage, stale-PR nudges, changelog drafts and health scoring."
requires-python = ">=3.12,<3.13"
dependencies = [
    "agents-core",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
]

[project.entry-points."agents_core.agents"]
repo_maint = "agents.repo_maint.agent:AGENT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.uv.sources]
agents-core = { git = "https://github.com/Kghaffari26/agents-core", rev = "v0.1.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
