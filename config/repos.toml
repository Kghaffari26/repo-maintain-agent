[settings]
stale_days = 14
include_drafts = false
dup_threshold = 0.45
max_triage_per_repo_per_run = 25
max_changelog_items = 80
max_writes_per_run = 15
max_writes_per_repo_per_day = 10
# Fix proposer (spec §6.1): at most this many agent loops per run, each capped at
# fix_loop_max_steps model calls and fix_loop_max_usd.
max_fix_proposals_per_run = 2
fix_loop_max_steps = 12
fix_loop_max_usd = 0.15

[health.penalties]
untriaged_7d_each = 3
untriaged_cap = 30
stale_pr_each = 5
stale_pr_cap = 25
first_response_72h = 10
first_response_168h = 15
ci_failure = 20
release_overdue = 10
community_missing_each = 3

# This repo first (spec §1 Goals), then the other repos in the agents-core family.
[[repo]]
full_name = "Kghaffari26/repo-maintain-agent"
role = "own"
allow_apply = false
token = "default"
label_map = { bug = "bug", feature = "enhancement", question = "question", docs = "documentation", chore = "chore" }
priority_labels = {}
extra_triaged_labels = ["triaged"]
ignore_labels = ["wontfix", "on-hold"]

